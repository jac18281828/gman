# SPDX-License-Identifier: LGPL-2.1-or-later
name: release
# A tag is the release trigger. Tags are bare versions -- 0.6.0, no v prefix
# -- and land on main's release commit, per the checksmix workflow.
on:
  push:
    tags: ["*"]
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # The release is created first and empty, so every matrix leg has something
  # to upload into. Legs run with fail-fast off: one platform failing to build
  # should cost that platform's tarball, not the whole release.
  release:
    name: create the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # CHANGELOG.md carries every version back to 1999. The release body is
      # this version's section alone -- from its own "X.Y.Z (date)" heading to
      # the next one. An unmatched tag yields an empty body rather than the
      # whole file.
      - name: Extract this version's changelog section
        run: |
          awk -v ver="${{ github.ref_name }}" '
            $0 ~ "^" ver " \\(" { inside = 1; next }
            inside && /^[0-9]+(\.[0-9]+)* \(/ { exit }
            inside { print }
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "::warning::no CHANGELOG.md section for ${{ github.ref_name }}"
            echo "See CHANGELOG.md." > release-body.md
          fi
          cat release-body.md
      # A rerun of a partly-failed run must not fail on a release that
      # already exists, so edit it in place instead of creating again.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release edit "${{ github.ref_name }}" \
              --title "GMAN ${{ github.ref_name }}" \
              --notes-file release-body.md \
              --draft=false \
              --prerelease=false \
              --latest
          else
            gh release create "${{ github.ref_name }}" \
              --title "GMAN ${{ github.ref_name }}" \
              --notes-file release-body.md \
              --latest
          fi
  binaries:
    name: ${{ matrix.target }}
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-latest
            target: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build \
            libtiff-dev libpng-dev zlib1g-dev libjpeg-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake libtiff libpng jpeg
      # A release ships a tested build or it does not ship. This build keeps
      # tests on, so it exports every symbol and the suite reaches internals
      # as CI's does; the package build below is the one that ships.
      - name: Configure the test build
        run: |
          cmake --preset release -B build-release-test \
            -DBUILD_TESTING=ON -DGMAN_WITH_PNG=ON -DGMAN_WITH_JPEG=ON
      - name: Build the test build
        run: cmake --build build-release-test --parallel
      - name: Test
        run: ctest --test-dir build-release-test --output-on-failure
      - name: Configure the package build
        run: cmake --preset release -DGMAN_WITH_PNG=ON -DGMAN_WITH_JPEG=ON
      - name: Build the package build
        run: cmake --build build-release --parallel
      # The operator's concern is shipping a tarball built with tests on by
      # accident, which would export internals; this makes it impossible.
      - name: Guard against a test build shipping
        run: grep -qx "BUILD_TESTING:BOOL=OFF" build-release/CMakeCache.txt
      - name: Stage the install tree
        run: |
          cmake --install build-release \
            --prefix "${{ runner.temp }}/stage/gman-${{ github.ref_name }}-${{ matrix.target }}"
      # The staged gman must find its own plugins from wherever it is
      # extracted -- that is what the relative INSTALL_RPATH buys, and a
      # tarball that cannot render is not worth publishing. The package build
      # hides everything GMAN_EXPORT does not tag, so this is where a missing
      # tag first shows: sphere.rib alone loads no shader plugin, so the four
      # renders below cover every shipped shader. texture.rib cannot open
      # checker_texture.tif and renders with opaque black; that is expected.
      - name: Verify the staged binary renders
        run: |
          cd "${{ runner.temp }}/stage/gman-${{ github.ref_name }}-${{ matrix.target }}"
          ./bin/gman "${{ github.workspace }}/tests/rib/sphere.rib"
          test -s sphere.tif
          rm -f sphere.tif
          ./bin/gman "${{ github.workspace }}/tests/rib/shaders.rib"
          test -s shaders.tif
          rm -f shaders.tif
          ./bin/gman "${{ github.workspace }}/tests/rib/texture.rib"
          test -s texture.tif
          rm -f texture.tif
          ./bin/gman "${{ github.workspace }}/tests/rib/shinymetal_degrades.rib"
          test -s shinymetal_degrades.tif
          rm -f shinymetal_degrades.tif
      # The explicit ON configure above means a runner missing either
      # library fails configure instead of silently shipping a tarball
      # with a driver quietly missing.
      - name: Verify the staged binary's driver list
        run: |
          cd "${{ runner.temp }}/stage/gman-${{ github.ref_name }}-${{ matrix.target }}"
          ./bin/gman --version | grep -qx "drivers: tiff pnm png jpeg"
      - name: Package
        run: |
          cd "${{ runner.temp }}/stage"
          tar czf "gman-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" \
            "gman-${{ github.ref_name }}-${{ matrix.target }}"
          shasum -a 256 "gman-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" \
            > "gman-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256"
      # The third-party action this replaced intermittently failed to create
      # its asset temp dir on ubuntu-24.04-arm and macos-latest; gh ships on
      # the runner image itself, so it carries no such gap.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd "${{ runner.temp }}/stage"
          gh release upload "${{ github.ref_name }}" \
            "gman-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" \
            "gman-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256" \
            --clobber
