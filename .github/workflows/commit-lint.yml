# SPDX-License-Identifier: LGPL-2.1-or-later
name: commitlint
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches: ["**"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install dependencies
        run: npm install -g @commitlint/{cli,config-conventional}
      # On a pull request, validate every commit the PR contributes. On a
      # bare push the PR commit count is absent. A push to main is a
      # fast-forward, so the range the push reported is exactly the landed
      # commits; fall back to the tip commit when `before` is unavailable
      # (all zeros). A push to any other branch cannot trust `before`: a
      # force-push, which every rebase is, leaves it outside the new tip's
      # history and shrinks the range to the tip alone. Validate every
      # commit since the merge-base with main instead, and fall back to the
      # tip commit when there is none (an unrelated history). A tip equal to
      # the merge-base adds no commits and passes.
      # The step reads the branch name from the environment: it is
      # attacker-chosen text, unsafe to interpolate into the script.
      - name: Validate commit messages
        env:
          REF_NAME: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          if [ -n "$PR_COMMITS" ]; then
            from="HEAD~${PR_COMMITS}"
          elif [ "$REF_NAME" = "main" ]; then
            if git rev-parse --verify --quiet "${BEFORE}^{commit}" > /dev/null; then
              from="$BEFORE"
            else
              from="HEAD~1"
            fi
          else
            from="$(git merge-base origin/main HEAD)" || from="HEAD~1"
          fi
          if [ "$(git rev-parse "$from")" = "$(git rev-parse HEAD)" ]; then
            echo "No commits to lint: HEAD adds nothing to origin/main."
            exit 0
          fi
          npx commitlint --from "$from" --to HEAD --verbose
