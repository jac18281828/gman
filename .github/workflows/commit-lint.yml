# SPDX-License-Identifier: LGPL-2.1-or-later
name: commitlint
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches: ["**"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install dependencies
        run: npm install -g @commitlint/{cli,config-conventional}
      # On a pull request, validate every commit the PR contributes. On a
      # bare push the PR commit count is absent, so fall back to the range
      # the push itself reported -- and to the single tip commit when that
      # is unavailable too (a new branch, where `before` is all zeros).
      - name: Validate commit messages
        run: |
          if [ -n "${{ github.event.pull_request.commits }}" ]; then
            from="HEAD~${{ github.event.pull_request.commits }}"
          elif git rev-parse --verify --quiet "${{ github.event.before }}^{commit}"; then
            from="${{ github.event.before }}"
          else
            from="HEAD~1"
          fi
          npx commitlint --from "$from" --to HEAD --verbose
